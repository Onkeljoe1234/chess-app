services:
  chess-app:
    build: .
    image: chess-app:latest
    container_name: chess-app
    ports:
      - "8000:8000"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:?set APP_PASSWORD in .env or environment}
      - NANO_THREADS=${NANO_THREADS:-4}
    volumes:
      - ./games:/data/games          # PGN archive survives redeploys
    restart: unless-stopped
